<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecondHandPlayer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a2e;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-family: monospace;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="info">SecondHandPlayer</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // Camera
        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 1.5, 3);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 1, 0);
        controls.update();

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);

        // Ground plane
        const groundGeometry = new THREE.PlaneGeometry(20, 20);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x2a2a4a,
            roughness: 0.8,
            transparent: true,
            opacity: 0.5
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid helper
        const gridHelper = new THREE.GridHelper(20, 20, 0x444466, 0x333355);
        scene.add(gridHelper);

        // Load GLB model
        let model = null;
        let mixer = null;
        const jointSpheres = [];
        const joints = [];
        const boneLines = [];
        const bonePairs = []; // [childJoint, parentJoint] pairs

        // Joint visualization material
        const jointMaterial = new THREE.MeshStandardMaterial({
            color: 0x00ffaa,
            emissive: 0x00ff88,
            emissiveIntensity: 0.3,
            roughness: 0.3,
            metalness: 0.5
        });
        const jointGeometry = new THREE.SphereGeometry(0.025, 16, 16);

        // Line material for bone connections
        const lineMaterial = new THREE.LineBasicMaterial({
            color: 0x00ffaa,
            linewidth: 2
        });

        const loader = new GLTFLoader();
        loader.load(
            'files/Loops1_export.glb',
            (gltf) => {
                model = gltf.scene;

                // Map to track joint indices
                const jointIndexMap = new Map();

                // Traverse model to find bones and meshes
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        // Hide the original mesh since it's invisible anyway
                        child.visible = false;
                    }
                    // Create spheres for bones/joints
                    if (child.isBone || child.type === 'Bone') {
                        jointIndexMap.set(child, joints.length);
                        joints.push(child);
                        const sphere = new THREE.Mesh(jointGeometry, jointMaterial);
                        sphere.castShadow = true;
                        jointSpheres.push(sphere);
                        scene.add(sphere);
                    }
                });

                // If no bones found, try creating spheres for all objects with names suggesting joints
                if (joints.length === 0) {
                    model.traverse((child) => {
                        if (child.isObject3D && child.name && child !== model) {
                            jointIndexMap.set(child, joints.length);
                            joints.push(child);
                            const sphere = new THREE.Mesh(jointGeometry, jointMaterial);
                            sphere.castShadow = true;
                            jointSpheres.push(sphere);
                            scene.add(sphere);
                        }
                    });
                }

                // Create lines connecting child bones to parent bones
                for (const joint of joints) {
                    if (joint.parent && jointIndexMap.has(joint.parent)) {
                        bonePairs.push([joint, joint.parent]);
                        const geometry = new THREE.BufferGeometry();
                        const positions = new Float32Array(6); // 2 points * 3 coords
                        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                        const line = new THREE.Line(geometry, lineMaterial);
                        boneLines.push(line);
                        scene.add(line);
                    }
                }

                scene.add(model);
                console.log(`Found ${joints.length} joints, ${boneLines.length} connections`);

                // Setup animation mixer if animations exist
                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.play();

                    document.getElementById('info').innerHTML =
                        `SecondHandPlayer<br>` +
                        `Joints: ${joints.length} | Bones: ${boneLines.length}<br>` +
                        `Animations: ${gltf.animations.length}`;
                } else {
                    document.getElementById('info').innerHTML =
                        `SecondHandPlayer<br>` +
                        `Joints: ${joints.length} | Bones: ${boneLines.length}<br>` +
                        `No animations found`;
                }

                console.log('Model loaded successfully', gltf);
            },
            (progress) => {
                const percent = (progress.loaded / progress.total * 100).toFixed(1);
                document.getElementById('info').innerHTML =
                    `SecondHandPlayer<br>Loading: ${percent}%`;
            },
            (error) => {
                console.error('Error loading model:', error);
                document.getElementById('info').innerHTML =
                    `SecondHandPlayer<br>Error loading model`;
            }
        );

        // Animation loop
        const clock = new THREE.Clock();

        const worldPos = new THREE.Vector3();
        const parentPos = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (mixer) {
                mixer.update(delta);
            }

            // Update joint sphere positions to follow bones
            for (let i = 0; i < joints.length; i++) {
                joints[i].getWorldPosition(worldPos);
                jointSpheres[i].position.copy(worldPos);
            }

            // Update bone line positions
            for (let i = 0; i < bonePairs.length; i++) {
                const [child, parent] = bonePairs[i];
                child.getWorldPosition(worldPos);
                parent.getWorldPosition(parentPos);

                const positions = boneLines[i].geometry.attributes.position.array;
                positions[0] = worldPos.x;
                positions[1] = worldPos.y;
                positions[2] = worldPos.z;
                positions[3] = parentPos.x;
                positions[4] = parentPos.y;
                positions[5] = parentPos.z;
                boneLines[i].geometry.attributes.position.needsUpdate = true;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
